# Postgres credentials — single source of truth for the Docker stack.
# Django/celery receive these via `environment` (not from .env).
x-postgres-credentials: &postgres-credentials
  POSTGRES_DB: lmsbrdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

x-django-db-env: &django-db-env
  <<: *postgres-credentials
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0

# Cap container logs so Celery/Django cannot fill the disk again.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  db:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    environment:
      <<: *postgres-credentials
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/pg_hba.conf"]
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --tcp-keepalive 300
      --timeout 0
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *django-db-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postgres:password@db:5432/lmsbrdb
    # Code is baked into the image — edits on disk do NOT go live until
    # `docker compose up -d --build django celery celery-beat` (or `make deploy`).
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "echo 'Waiting for database...' &&
             until python -c \"import socket; s=socket.socket(); s.settimeout(1); s.connect(('db',5432)); s.close()\" 2>/dev/null; do sleep 1; done &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --capture-output --access-logfile - --error-logfile -"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *django-db-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postgres:password@db:5432/lmsbrdb
    volumes:
      - media_volume:/app/media
    depends_on:
      - django
      - redis
    command: celery -A config.celery worker --loglevel=info --concurrency=4

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *django-db-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postgres:password@db:5432/lmsbrdb
    volumes:
      - media_volume:/app/media
    depends_on:
      - django
      - redis
    command: celery -A config.celery beat --loglevel=info

  nginx:
    profiles: ["proxy"]
    image: nginx:alpine
    restart: always
    logging: *default-logging
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - django

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
