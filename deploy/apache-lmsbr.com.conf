# LMSBR v3 — Apache reverse proxy for lmsbr.com
# Frontend (Next.js :3000) + API (Django :8000)
#
# Install:
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo cp /var/www/html/lmsbr-v3/deploy/apache-lmsbr.com.conf /etc/apache2/sites-available/000-default.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
        ServerName lmsbr.com
        ServerAlias www.lmsbr.com api.lmsbr.com 18.181.105.119

        ServerAdmin webmaster@localhost

        ProxyPreserveHost On
        ProxyRequests Off
        # Preserve HTTPS from ELB/CloudFront; default to http for direct :80 access
        RequestHeader set X-Forwarded-Proto "http" "expr=-z %{HTTP:X-Forwarded-Proto}"

        # TipPhone PWA (Next.js) — must be before /api/ → Django
        ProxyPass /api/tiphone http://127.0.0.1:3000/api/tiphone
        ProxyPassReverse /api/tiphone http://127.0.0.1:3000/api/tiphone

        # Django API / admin / static / media
        ProxyPass /api/ http://127.0.0.1:8000/api/
        ProxyPassReverse /api/ http://127.0.0.1:8000/api/

        ProxyPass /admin/ http://127.0.0.1:8000/admin/
        ProxyPassReverse /admin/ http://127.0.0.1:8000/admin/

        ProxyPass /static/ http://127.0.0.1:8000/static/
        ProxyPassReverse /static/ http://127.0.0.1:8000/static/

        ProxyPass /media/ http://127.0.0.1:8000/media/
        ProxyPassReverse /media/ http://127.0.0.1:8000/media/

        # Next.js frontend (must be last — catch-all)
        ProxyPass / http://127.0.0.1:3000/
        ProxyPassReverse / http://127.0.0.1:3000/

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
